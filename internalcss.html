<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>internal css</title> 
    <style>
/* styling all <h1> elements*/
h1{
    color:rgb(244, 13, 13);
    text-align: center;
    font-size: 40px;
}
h2{
    color: rgb(121, 131, 131);
    text-decoration:underline ;
}
/* styling all <p> elements*/
    p{
        color:blue;
        font-size: 30px;
        line-height: 1.5;
    }
/* styling the small */
small{
    background-color: rgb(198, 209, 209);
    color:rgb(166, 116, 51);
    padding:10px;
}
/*styling links*/
a{
    color: rgb(74, 170, 170);
    text-decoration:rgb(45, 150, 150) ;
    font-size:16px ;
}
/*styling the image*/
img{
   width: 200px;
   border:5px solid red;
   border-radius: 10px;
}
/*styling the table*/
table{
    border-collapse:collapse ;
    width: 60%;
}
th{
     background-color:rgb(107, 107, 118) ;
    color: aliceblue;
    padding:10px;
}
td{
    border-color:rgb(193, 114, 114) ;
color:rgb(91, 91, 180);
padding:20px;
text-align: center;
}
button{
    background-color: rgb(233, 239, 239);
    color: rgb(18, 19, 20);
    padding: 12px;
    border: none;
    border-radius:5px ;
    font-size:16px ;
}
ul{
    color: rgb(25, 14, 1);
    font-size: 10px;
}
/*styling list items*/
li{
    margin: 8px;
}

/* styling horizontal line */
hr{
  border-radius: 2px solid rgb(128,128,131);
}

    /*styling highlighted text*/
mark{
    background-color: rgb(203, 203, 206);
}
</style>
</head>
<body>
    <h1>MY WEBSITE</h1>
    <h2>This is an example of internal css</h2>
    <p><mark>Internal css is used to styling</mark></p>
<p>
    My name is Lahari.<br>
    <small>I am studying engineering in malla reddy college</small>
</p>

<!--styling the link-->

<h2>useful link</h2>

<a href="htts//www.youtube.com"target="_blank">Lahari</a><br>

</body>
</html>
