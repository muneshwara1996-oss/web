<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css selector</title>
</head>
<body>
  <style>
p{
    color: green;
}
/* 2. class selector */
.highlights {
    color: red;
    background-color: yellow;
}
/* 3. ID selector */
#special {
    color: rgb(52, 52, 186);
    font-size: 25px;
}

  </style>
<body>
    <h1>CSS Selectors</h1>

    <!--Elements Selector-->
    <p>if u think your bad im your dad </p>
    <p>ram charan is my favourite hero </p>

    <!---Class Selector-->
    <p class="Lahari"> this is my highlight text.</p> 
    <h2 class="Muni">This heading also uses the class</h2>
</body>
</body>
</html>
