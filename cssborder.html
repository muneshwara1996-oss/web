<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css border</title>
</head>
<style>

.box1{
        border:3px solid black;
        border-radius: 15px;
    }
.box2{
        border: 5px dashed blue;
        border-radius: 16px;
    }
.box3{
        border: 6px dotted brown;
        border-radius: 17px;
    }
.box4{
        border:9px double purple ;
        border-radius:18px ;
    }
</style>

<body>
 <h1>CSS Border</h1> 
 <p>This paragraph has a solid border</p>

 <p class="box1">This is a dashed border</p>

 <p class="box2">This is a dotted border</p>

 <p class="box3">This is a double border</p>

 <p class="box4">This is a rounded border</p>

</body>
</html>
